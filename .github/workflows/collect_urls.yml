name: Collect Listing URLs

on:
  workflow_dispatch: {}   # only runs when you click "Run workflow" manually

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run URL collector
        run: python collect_urls.py

      - name: Commit and push listing_urls.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listing_urls.txt
          git commit -m "Update listing_urls.txt with collected URLs" || echo "No changes to commit"
          git push
